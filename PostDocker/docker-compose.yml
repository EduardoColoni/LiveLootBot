services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      # Precisam bater com DB_USER / DB_PASSWORD / DB_NAME do .env da aplicação (src/.env),
      # senão a API e o bot não conseguem conectar.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # O Postgres executa o que estiver aqui na PRIMEIRA criação do volume.
      # É o schema versionado, então o banco nasce pronto.
      - ../migrations/000_schema_inicial.sql:/docker-entrypoint-initdb.d/000_schema_inicial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    environment:
      # O token vem daqui, não do ngrok.yml — assim o arquivo pode ir para o Git.
      - NGROK_AUTHTOKEN=${NGROK_TOKEN}
    extra_hosts:
      # No Docker do Linux esse nome não existe sozinho; sem isto o túnel não
      # alcança a API rodando na máquina (ERR_NGROK_8012).
      - "host.docker.internal:host-gateway"
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    networks:
      - app-network
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
